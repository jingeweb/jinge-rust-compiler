[package]
name = "jinge-compiler"
version = "4.1.13"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
sha2 = "0.11.1"
base64ct = "1.8.3"
swc_core = { version = "82.2.0", features = ["ecma_plugin_transform"] }
swc_ecma_parser = "46.1.2"
swc_common = "26.0.0"
swc_ecma_codegen = "32.0.5"
swc_ecma_transforms_base = "50.0.3"
swc_ecma_transforms_typescript = "56.0.1"
swc_ecma_visit = "29.0.0"
lazy_static = "1.5.1"
hashbrown = "0.17.1"
neon = { version = "1.1.2", features = ["napi-6"] }

# .cargo/config defines few alias to build plugin.
# cargo build-wasi generates wasm-wasi32 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.
