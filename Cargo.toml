[package]
name = "jinge-compiler"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
sha2 = "0.10"
base64ct = "1.7"
swc_core = { version = "16", features = ["ecma_plugin_transform"] }
swc_ecma_parser = "10"
swc_common = "8"
swc_ecma_codegen = "8"
swc_ecma_transforms_base = "11"
swc_ecma_transforms_typescript = "12"
swc_ecma_visit = "8"
lazy_static = "1.5"
hashbrown = "0.15"
neon = { version = "1", features = ["napi-6" ] }

# .cargo/config defines few alias to build plugin.
# cargo build-wasi generates wasm-wasi32 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.
