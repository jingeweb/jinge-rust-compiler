[package]
name = "jinge-compiler"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
sha2 = "0.10.9"
base64ct = "1.8.0"
swc_core = { version = "44.0.2", features = ["ecma_plugin_transform"] }
swc_ecma_parser = "24.0.3"
swc_common = "14.0.4"
swc_ecma_codegen = "17.0.2"
swc_ecma_transforms_base = "27.0.0"
swc_ecma_transforms_typescript = "30.0.1"
swc_ecma_visit = "15.0.0"
lazy_static = "1.5.0"
hashbrown = "0.16.0"
neon = { version = "1.1.1", features = ["napi-6" ] }

# .cargo/config defines few alias to build plugin.
# cargo build-wasi generates wasm-wasi32 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.
