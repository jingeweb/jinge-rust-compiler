name: build and release

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  id-token: write
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.os_name }} with rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: libjinge_compiler.so
          - os_name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: libjinge_compiler.so
          - os_name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: jinge_compiler.dll
            node: x86_64-windows.node
          - os_name: darwin-x64
            os: macOS-latest
            target: x86_64-apple-darwin
            bin: libjinge_compiler.dylib
          - os_name: darwin-arm64
            os: macOS-latest
            target: aarch64-apple-darwin
            bin: libjinge_compiler.dylib
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm -v
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm ci
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: "build"
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args: "--locked --release"
          strip: true
      - name: Copy to bindings directory
        run: mv target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} platform/${{ matrix.platform.os_name }}/index.node
      - name: Publish to npm
        working-directory: platform/${{ matrix.platform.os_name }}
        run: npm publish --provenance
