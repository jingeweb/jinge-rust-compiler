name: compiler tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: jinge-compiler
      - uses: actions/checkout@v6
        with:
          repository: jingeweb/jinge
          ref: dev
          path: jinge
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        working-directory: jinge
      - run: pnpm build
        working-directory: jinge
      # A version bump leaves the lock unchanged until native packages are
      # published. Unpublished optional bindings can be skipped: tests build
      # the local binding from source rather than loading a registry package.
      - run: pnpm install --no-frozen-lockfile
        working-directory: jinge-compiler
      - run: pnpm lint
        working-directory: jinge-compiler
      - run: pnpm test:types
        working-directory: jinge-compiler
      - run: pnpm test
        working-directory: jinge-compiler
      - run: pnpm exec playwright install --with-deps chrome
        working-directory: jinge-compiler
      - run: pnpm test:e2e
        working-directory: jinge-compiler
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            jinge-compiler/coverage/e2e-report
            jinge-compiler/coverage/e2e-results
            jinge-compiler/coverage/e2e-results.json
      - if: github.event_name == 'workflow_dispatch'
        run: rustup component add llvm-tools-preview
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm test:coverage
        working-directory: jinge-compiler
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            jinge-compiler/coverage/rust-summary.txt
            jinge-compiler/coverage/rust-html
            jinge-compiler/coverage/compiler-ts
            jinge-compiler/coverage/runtime
